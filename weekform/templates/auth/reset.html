{% extends "base.html" %}
{% block title %}New password — weekform{% endblock %}
{% block content %}
<h1>New password</h1>
<form method="post" action="{{ url_for('auth.reset', token=token) }}" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label class="field">
    <span>Password</span>
    <input type="password" name="password" autocomplete="new-password"
           minlength="10" required autofocus>
    <small>At least 10 characters.</small>
  </label>
  <button type="submit" class="btn btn-primary">Save and sign in</button>
</form>
{% endblock %}
