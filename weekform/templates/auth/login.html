{% extends "base.html" %}
{% block title %}Sign in — weekform{% endblock %}
{% block content %}

<h1>Sign in</h1>

<form method="post" action="{{ url_for('auth.login_submit') }}" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next|default('') }}">

  <label class="field">
    <span>Email</span>
    <input type="email" name="email" value="{{ email|default('') }}"
           autocomplete="email" required autocapitalize="off" spellcheck="false">
  </label>

  <label class="field">
    <span>Password</span>
    <input type="password" name="password" autocomplete="current-password" required>
  </label>

  <button type="submit" class="btn btn-primary">Sign in</button>
</form>

<p class="alt">
  <a href="{{ url_for('auth.forgot_form') }}">Forgotten password</a> ·
  <a href="{{ url_for('auth.signup_form') }}">Sign up</a>
</p>

{% endblock %}
