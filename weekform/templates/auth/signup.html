{% extends "base.html" %}
{% block title %}Sign up — weekform{% endblock %}
{% block content %}

<h1>Sign up</h1>
<p class="lede">Keeps your weeks so they survive a new phone.</p>

<form method="post" action="{{ url_for('auth.signup') }}" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">

  <label class="field">
    <span>Email</span>
    <input type="email" name="email" value="{{ email|default('') }}"
           autocomplete="email" required autocapitalize="off" spellcheck="false">
  </label>

  <label class="field">
    <span>Password</span>
    <input type="password" name="password" autocomplete="new-password"
           minlength="10" required>
    <small>At least 10 characters.</small>
  </label>

  <label class="check">
    <input type="checkbox" name="consent" value="yes" required>
    <span>I understand weekform stores the activities I enter, so I can keep my
      own history. It is never sold or shared.</span>
  </label>

  <button type="submit" class="btn btn-primary">Create account</button>
</form>

<p class="alt">Already have one? <a href="{{ url_for('auth.login') }}">Sign in</a></p>

{% endblock %}
